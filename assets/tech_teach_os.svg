<svg width="360" height="520" viewBox="0 0 360 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="360" y1="0" x2="0" y2="520">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="45%" stop-color="#111111"/>
      <stop offset="75%" stop-color="#D9D9D9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="360" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="344" height="504" rx="34" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="343" height="503" rx="33.5" stroke="white" stroke-opacity="0.35"/>

  <text x="30" y="52" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    GRAY_WHALE_CO
  </text>

  <circle cx="300" cy="48" r="24" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="286" y="56" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">
    GW
  </text>

  <rect x="30" y="110" width="300" height="1.5" fill="url(#line)" opacity="0.8"/>

  <text x="30" y="158" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="1" filter="url(#glow)">
    tech_teach_OS
  </text>

  <text x="30" y="195" fill="#D0D0D0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">
