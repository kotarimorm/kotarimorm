  </text>

  <text x="30" y="219" fill="#D0D0D0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">
    low-level kernel experiments.
  </text>

  <rect x="30" y="270" width="82" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="54" y="292" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
    BETA
  </text>

  <rect x="124" y="270" width="76" height="34" rx="17" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.5"/>
  <text x="147" y="292" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
    x86
  </text>

  <rect x="212" y="270" width="98" height="34" rx="17" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.5"/>
  <text x="235" y="292" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
    OSDev
  </text>

  <text x="30" y="355" fill="#FFFFFF" font-family="monospace" font-size="14">
    GDT · IDT · PIC · ISR
  </text>

  <text x="30" y="380" fill="#FFFFFF" font-family="monospace" font-size="14">
    VGA · PS/2 · ATA · PCI
  </text>

  <text x="30" y="425" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
