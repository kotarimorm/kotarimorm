<svg width="420" height="620" viewBox="0 0 420 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainBg" x1="420" y1="0" x2="0" y2="620">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="28%" stop-color="#050505"/>
      <stop offset="58%" stop-color="#303030"/>
      <stop offset="82%" stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="strokeGrad" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="400" height="600" rx="38" fill="url(#mainBg)"/>
  <rect x="10.5" y="10.5" width="399" height="599" rx="37.5" stroke="url(#strokeGrad)" stroke-width="1.5"/>

  <!-- Glow overlay -->
  <rect x="10" y="10" width="400" height="600" rx="38" fill="url(#glow)"/>

  <!-- Giant background mark -->
  <text x="210" y="185" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.11"
        font-family="Arial, Helvetica, sans-serif"
        font-size="84" font-weight="900" letter-spacing="-5">
    OS
  </text>

  <!-- Top brand -->
  <text x="34" y="56"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" letter-spacing="3">
    GRAY_WHALE_CO
  </text>

  <rect x="306" y="34" width="70" height="32" rx="16" fill="#FFFFFF"/>
  <text x="341" y="55" text-anchor="middle"
        fill="#000000"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    BETA
  </text>

  <!-- Dark information panel -->
  <rect x="30" y="120" width="360" height="430" rx="28" fill="#050505" fill-opacity="0.88"/>
  <rect x="30.5" y="120.5" width="359" height="429" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.18"/>

  <!-- Project title -->
  <text x="54" y="174"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31" font-weight="900" letter-spacing="0.5"
        filter="url(#softGlow)">
    tech_teach_OS
  </text>

  <text x="56" y="207"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700">
    OSDev reference stand for
  </text>

  <text x="56" y="231"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700">
    kernels, drivers and debugging.
  </text>

  <!-- Topic grid -->
  <rect x="54" y="270" width="312" height="92" rx="18" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <text x="78" y="300"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="14" font-weight="700">
    GDT · IDT · PIC · ISR
  </text>

  <text x="78" y="326"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="14" font-weight="700">
    PIT · Paging · PMM
  </text>

  <text x="78" y="346"
        fill="#8E8E8E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="700">
    VGA · PS/2 · ATA · PCI · panic debug
  </text>

  <!-- Tags -->
  <rect x="54" y="390" width="82" height="34" rx="17" fill="#FFFFFF"/>
  <text x="95" y="412" text-anchor="middle"
        fill="#000000"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    BETA
  </text>

  <rect x="146" y="390" width="72" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="182" y="412" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    x86
  </text>

  <rect x="228" y="390" width="86" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="271" y="412" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    NASM
  </text>

  <rect x="54" y="438" width="132" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="120" y="460" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    reference stand
  </text>

  <rect x="196" y="438" width="118" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="255" y="460" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    OSDev kit
  </text>

  <!-- Bottom description -->
  <text x="56" y="505"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700">
    When your kernel explodes at 3 AM,
  </text>

  <text x="56" y="527"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700">
    open the reference and find the missing piece.
  </text>

  <!-- CTA -->
  <text x="34" y="582"
        fill="#000000"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" letter-spacing="2">
    OPEN REFERENCE →
  </text>
</svg>
