<svg width="420" height="620" viewBox="0 0 420 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="420" y2="620">
      <stop offset="0%" stop-color="#0B1624"/>
      <stop offset="42%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0%" stop-color="#5D6673" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#D8DEE9" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#9CCBFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#9CCBFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9CCBFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="120" x2="420" y2="560">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#02040A" stop-opacity="0.94"/>
    </linearGradient>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="400" height="600" rx="22" fill="url(#bg)"/>
  <rect x="10.5" y="10.5" width="399" height="599" rx="21.5" stroke="url(#steel)" stroke-width="1.2"/>

  <!-- Cold glow -->
  <rect x="10" y="10" width="400" height="600" rx="22" fill="url(#glow)"/>

  <!-- Technical diagonal shapes -->
  <path d="M10 118 L140 10 H410 V92 L300 132 H10 Z" fill="#FFFFFF" fill-opacity="0.035"/>
  <path d="M410 452 L260 610 H410 Z" fill="#9CCBFF" fill-opacity="0.055"/>
  <path d="M10 520 L115 610 H10 Z" fill="#FFFFFF" fill-opacity="0.035"/>

  <!-- Top brand -->
  <text x="32" y="50"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900" letter-spacing="3">
    GRAY_WHALE_CO
  </text>

  <!-- Whale/W abstract mark -->
  <g transform="translate(315 31)">
    <path d="M8 25 C18 2, 31 2, 40 25 C49 2, 62 2, 72 25"
          stroke="url(#steel)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M18 30 C28 43, 52 43, 62 30"
          stroke="#D8DEE9" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Separator -->
  <rect x="32" y="83" width="356" height="1.2" fill="url(#steel)" opacity="0.8"/>

  <!-- Main panel -->
  <rect x="32" y="118" width="356" height="402" rx="18" fill="url(#panel)"/>
  <rect x="32.5" y="118.5" width="355" height="401" rx="17.5" stroke="#D8DEE9" stroke-opacity="0.12"/>

  <!-- Large faded title mark -->
  <text x="210" y="244" text-anchor="middle"
        fill="#FFFFFF" fill-opacity="0.045"
        font-family="Arial, Helvetica, sans-serif"
        font-size="74" font-weight="900" letter-spacing="-3">
    SENT
  </text>

  <!-- Project title -->
  <text x="56" y="175"
        fill="#F5F7FA"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32" font-weight="900" letter-spacing="1"
        filter="url(#textGlow)">
    SENTINEL_LANG
  </text>

  <text x="58" y="204"
        fill="#9CCBFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" letter-spacing="2">
    LOW-LEVEL COMPILER
  </text>

  <text x="58" y="235"
        fill="#AEB7C2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700">
    Experimental systems language
  </text>

  <text x="58" y="257"
        fill="#AEB7C2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700">
    designed for OSDev and NASM output.
  </text>

  <!-- Pipeline box -->
  <rect x="56" y="298" width="308" height="74" rx="12" fill="#02040A" stroke="#D8DEE9" stroke-opacity="0.16"/>

  <text x="78" y="327"
        fill="#F5F7FA"
        font-family="monospace"
        font-size="15" font-weight="700">
    .sl → AST → NASM → BIN
  </text>

  <text x="78" y="352"
        fill="#6F7A88"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="700">
    lexer · parser · codegen · flat binary
  </text>

  <!-- Tags -->
  <rect x="56" y="402" width="94" height="30" rx="8" fill="#D8DEE9"/>
  <text x="103" y="422" text-anchor="middle"
        fill="#02040A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    v0.2-alpha
  </text>

  <rect x="160" y="402" width="66" height="30" rx="8" fill="#0B1624" stroke="#D8DEE9" stroke-opacity="0.28"/>
  <text x="193" y="422" text-anchor="middle"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    x64
  </text>

  <rect x="236" y="402" width="78" height="30" rx="8" fill="#0B1624" stroke="#D8DEE9" stroke-opacity="0.28"/>
  <text x="275" y="422" text-anchor="middle"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    NASM
  </text>

  <rect x="56" y="444" width="118" height="30" rx="8" fill="#0B1624" stroke="#D8DEE9" stroke-opacity="0.28"/>
  <text x="115" y="464" text-anchor="middle"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    low-code emit
  </text>

  <rect x="184" y="444" width="130" height="30" rx="8" fill="#0B1624" stroke="#D8DEE9" stroke-opacity="0.28"/>
  <text x="249" y="464" text-anchor="middle"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    compiler core
  </text>

  <!-- Bottom CTA -->
  <rect x="32" y="548" width="356" height="1.2" fill="url(#steel)" opacity="0.55"/>

  <text x="32" y="583"
        fill="#D8DEE9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900" letter-spacing="2.5">
    OPEN PROJECT →
  </text>

  <text x="290" y="583"
        fill="#6F7A88"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="800">
    GRAY_WHALE_CO
  </text>
</svg>
