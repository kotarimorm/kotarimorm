<svg width="420" height="620" viewBox="0 0 420 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainBg" x1="0" y1="0" x2="420" y2="620">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="16%" stop-color="#CFCFCF"/>
      <stop offset="38%" stop-color="#303030"/>
      <stop offset="72%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="strokeGrad" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="400" height="600" rx="38" fill="url(#mainBg)"/>
  <rect x="10.5" y="10.5" width="399" height="599" rx="37.5" stroke="url(#strokeGrad)" stroke-width="1.5"/>

  <!-- Glow overlay -->
  <rect x="10" y="10" width="400" height="600" rx="38" fill="url(#glow)"/>

  <!-- Giant background mark -->
  <text x="210" y="185" text-anchor="middle"
        fill="#000000" fill-opacity="0.18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92" font-weight="900" letter-spacing="-5">
    GW
  </text>

  <!-- Top brand -->
  <text x="34" y="56"
        fill="#050505"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" letter-spacing="3">
    GRAY_WHALE_CO
  </text>

  <rect x="310" y="34" width="62" height="32" rx="16" fill="#050505"/>
  <text x="341" y="55" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    x64
  </text>

  <!-- Dark information panel -->
  <rect x="30" y="120" width="360" height="430" rx="28" fill="#050505" fill-opacity="0.88"/>
  <rect x="30.5" y="120.5" width="359" height="429" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.18"/>

  <!-- Project title -->
  <text x="54" y="178"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="900" letter-spacing="1"
        filter="url(#softGlow)">
    SENTINEL
  </text>

  <text x="56" y="207"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700">
    experimental low-level language
  </text>

  <text x="56" y="231"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700">
    compiling directly to NASM
  </text>

  <!-- Pipeline -->
  <rect x="54" y="270" width="312" height="74" rx="18" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <text x="78" y="300"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="15" font-weight="700">
    .sl  →  AST  →  NASM  →  BIN
  </text>

  <text x="78" y="326"
        fill="#8E8E8E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="700">
    lexer · parser · codegen · flat binary
  </text>

  <!-- Feature grid -->
  <rect x="54" y="370" width="88" height="34" rx="17" fill="#FFFFFF"/>
  <text x="98" y="392" text-anchor="middle"
        fill="#000000"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    v0.2-alpha
  </text>

  <rect x="152" y="370" width="72" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="188" y="392" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    OSDev
  </text>

  <rect x="234" y="370" width="72" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="270" y="392" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    NASM
  </text>

  <rect x="54" y="418" width="116" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="112" y="440" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    low-code emit
  </text>

  <rect x="180" y="418" width="126" height="34" rx="17" fill="#1A1A1A" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="243" y="440" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="900">
    compiler core
  </text>

  <!-- Bottom description -->
  <text x="56" y="488"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700">
    Built for people who want readable syntax
  </text>

  <text x="56" y="510"
        fill="#BEBEBE"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700">
    without losing control over the machine.
  </text>

  <!-- CTA -->
  <text x="34" y="582"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="900" letter-spacing="2">
    OPEN PROJECT →
  </text>
</svg>
